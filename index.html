<body data-chapter="none">

  <!-- 🌙 the dreamscape -->
  <div class="scene" aria-hidden="true">
    <div class="scene__moon">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="34" fill="#ffe9b3" />
        <circle cx="38" cy="42" r="5" fill="#f2d68f" />
        <circle cx="59" cy="62" r="7" fill="#f2d68f" />
        <circle cx="61" cy="36" r="3.4" fill="#f2d68f" />
        <path d="M40 51 q5 4.5 10 0" stroke="#caa14e" stroke-width="2.6" fill="none" stroke-linecap="round" />
        <path d="M55 49 q4 3.6 8 0" stroke="#caa14e" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M48 58 q4 3 8 0" stroke="#caa14e" stroke-width="2" fill="none" stroke-linecap="round" />
      </svg>
    </div>
    <div class="cloud cloud--1"></div>
    <div class="cloud cloud--2"></div>
    <div class="cloud cloud--3"></div>
    <div class="stars" id="stars"></div>
    <div class="fireflies" id="fireflies"></div>
  </div>

  <!-- ✦ chrome -->
  <header class="chrome chrome--top">
    <a class="brand" href="#cover">✦ OnlyActions</a>
    <a class="btn btn--ghost" href="https://github.com/onlyactions" target="_blank" rel="noopener">GitHub ↗</a>
  </header>

  <main class="stage">
    <div class="book-wrap" id="bookWrap">
      <div class="book-glow" aria-hidden="true"></div>
      <div class="book" id="book" role="group" aria-label="The OnlyActions storybook"></div>
      <button type="button" class="corner corner--prev" aria-label="Previous page"></button>
      <button type="button" class="corner corner--next" aria-label="Next page"></button>
    </div>
  </main>

  <footer class="chrome chrome--bottom">
    <button type="button" id="btnPrev" class="navbtn" aria-label="Previous page">←</button>
    <div class="dots" id="dots" role="tablist" aria-label="Spreads"></div>
    <button type="button" id="btnToC" class="navbtn navbtn--ribbon" aria-label="Back to the Contents">📖</button>
    <button type="button" id="btnNext" class="navbtn" aria-label="Next page">→</button>
  </footer>

  <div class="sr-only" aria-live="polite" id="announcer"></div>

  <noscript>
    <div class="nojs">
      <h1>OnlyActions — a tiny storybook of tools</h1>
      <p>The storybook needs JavaScript to flip its pages. Until then, the plain tale:</p>
      <ul>
        <li><a href="https://github.com/onlyactions">The workshop (GitHub)</a> — where the tools live</li>
      </ul>
    </div>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
