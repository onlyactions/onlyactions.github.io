<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toon Table of Contents — OnlyActions</title>
  <meta name="description" content="Activate the spell card and open the living grimoire: a full-screen Toon table of contents and manual for every OnlyActions project. Not cute — powerful." />
  <meta name="theme-color" content="#0b0518" />
  <link rel="canonical" href="https://onlyactions.github.io/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://onlyactions.github.io/" />
  <meta property="og:title" content="Toon Table of Contents — OnlyActions" />
  <meta property="og:description" content="A spell card, a duel arena, and a full-screen living grimoire holding the ToC and manual of every OnlyActions project." />
  <meta property="og:image" content="https://onlyactions.github.io/ToonTableOfContents.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='52' height='56' rx='10' fill='%230c6b3c'/%3E%3Crect x='14' y='10' width='36' height='44' rx='4' fill='%23f6ecd4'/%3E%3Ctext x='18' y='40' font-size='26' font-family='sans-serif' font-weight='bold' fill='%230c6b3c'%3EiN%3C/text%3E%3Ccircle cx='47' cy='17' r='6' fill='%23ffd34d'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@700;900&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ══════════════════════════ SCENE I — THE DUEL ARENA ══════════════════════════ -->
  <section id="arena" class="arena" aria-label="The duel arena">
    <div class="arena__bg" aria-hidden="true">
      <div class="arena__glow"></div>
      <div id="arenaStars" class="arena__stars"></div>
      <div class="magiccircle magiccircle--a"></div>
      <div class="magiccircle magiccircle--b"></div>
      <div class="arena__rays"></div>
      <div class="arena__floor"></div>
    </div>

    <header class="arena__brand">
      <span class="arena__brand-pre">ONLYACTIONS PRESENTS</span>
      <span class="arena__brand-rule"></span>
      <span class="arena__brand-post">A TABLE OF CONTENTS WITH TEETH</span>
    </header>

    <div class="arena__deck" aria-hidden="true">
      <span class="deckcard deckcard--1"></span>
      <span class="deckcard deckcard--2"></span>
      <span class="deckcard deckcard--3"></span>
      <span class="deckcard deckcard--4"></span>
    </div>

    <button id="heroCard" class="spellcard" data-action="activate" aria-label="Activate the spell card Toon Table of Contents">
      <span class="spellcard__frame">
        <span class="spellcard__name">TOON TABLE OF CONTENTS</span>
        <span class="spellcard__icon" aria-hidden="true"><i></i></span>
        <span class="spellcard__art" data-art="book"></span>
        <span class="spellcard__type">NORMAL SPELL</span>
        <span class="spellcard__text">Add 1 &ldquo;Toon&rdquo; chapter from your Deck to your screen. Once per turn: turn any page of this book, ignoring the rules. The toons are always watching.</span>
        <span class="spellcard__foot"><span>ONLYACTIONS</span><span>1ST ED &#10022;</span></span>
      </span>
      <span class="spellcard__shine" aria-hidden="true"></span>
    </button>

    <p class="arena__hint" aria-hidden="true"><b>CLICK THE CARD TO ACTIVATE</b><span>or press ENTER</span></p>

    <footer class="arena__foot">
      <button class="btn-line" data-action="skip">skip the ritual &#8594; straight to the book</button>
    </footer>
  </section>

  <!-- ══════════════════════════ SCENE II — THE GRIMOIRE ══════════════════════════ -->
  <section id="stage" class="stage" hidden aria-label="The grimoire">
    <div class="stage__bg" aria-hidden="true">
      <div class="stage__glow"></div>
      <div id="stageStars" class="stage__stars"></div>
      <div class="stage__floor"></div>
    </div>

    <header class="chrome chrome--top">
      <button class="wordmark" data-action="arena" title="Back to the arena">
        <span class="wordmark__seal">&#10022;</span> TOON TABLE OF CONTENTS
      </button>
      <nav class="chrome__tools" aria-label="Grimoire controls">
        <button class="tool" data-action="gallery" aria-label="Card gallery (G)" title="Card gallery (G)"><span>&#9638;</span> CARDS</button>
        <button class="tool" id="soundBtn" data-action="sound" aria-label="Mute (M)" title="Sound (M)"><span>&#9834;</span> SOUND</button>
        <button class="tool" data-action="fullscreen" aria-label="Fullscreen (F)" title="Fullscreen (F)"><span>&#9974;</span> FULL</button>
      </nav>
    </header>

    <div class="bookwrap">
      <div class="bookshadow" aria-hidden="true"></div>

      <!-- 3D grimoire (desktop) -->
      <div id="book" class="book book--closed" aria-live="polite"></div>

      <!-- flat page runner (mobile) -->
      <div id="flat" class="flat" aria-live="polite"></div>

      <!-- gold bookmark tabs (desktop) -->
      <nav id="tabs" class="tabs" aria-label="Bookmark tabs"></nav>
    </div>

    <footer class="chrome chrome--foot">
      <span id="spreadLabel" class="spreadlabel">SPREAD 0 / 5 &#8212; THE COVER</span>
      <span class="foot__hint">arrow keys turn pages &#183; G cards &#183; M sound &#183; ESC arena</span>
    </footer>

    <div id="tabChips" class="tabchips" aria-label="Chapters"></div>
  </section>

  <!-- ══════════════════════════ CARD GALLERY OVERLAY ══════════════════════════ -->
  <div id="gallery" class="gallery" role="dialog" aria-label="Card gallery">
    <button class="gallery__close" data-action="gallery-close" aria-label="Close gallery">&#10005;</button>
    <h2 class="gallery__title">&#10022; THE CARD GALLERY &#10022;</h2>
    <p class="gallery__sub">click a card to summon its spread</p>
    <div id="galleryGrid" class="gallery__grid"></div>
  </div>

  <div id="flash" class="flash" aria-hidden="true"></div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
